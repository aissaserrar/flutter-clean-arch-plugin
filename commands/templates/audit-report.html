<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clean Architecture audit</title>
<style>
  :root {
    --bg: #f7f7f5; --surface: #fff; --text: #1b1d1f; --muted: #6a7075; --line: #e3e4e1;
    --ok: #1a7f4b; --warn: #b26a00; --bad: #c0392b; --accent: #2457c5;
    --ok-bg: #e6f4ec; --warn-bg: #fdf0dc; --bad-bg: #fbe7e4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141516; --surface: #1d1f21; --text: #ecedee; --muted: #9aa0a6; --line: #2f3235;
      --ok: #4cc38a; --warn: #f0b24a; --bad: #ff7b6b; --accent: #7da2ff;
      --ok-bg: #16301f; --warn-bg: #3a2a10; --bad-bg: #3d1b17;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 16px; margin: 36px 0 12px; }
  .sub { color: var(--muted); font-size: 13px; }
  .badge { display: inline-block; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card .n { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .card .l { color: var(--muted); font-size: 13px; }
  .card.warn .n { color: var(--warn); } .card.bad .n { color: var(--bad); } .card.ok .n { color: var(--ok); }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .bar-row { display: grid; grid-template-columns: 130px 1fr 48px; gap: 12px; align-items: center; margin: 6px 0; font-size: 14px; }
  .bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .bar > i.bad { background: var(--warn); }
  .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
  code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  details { border-bottom: 1px solid var(--line); padding: 8px 0; }
  details:last-child { border-bottom: 0; }
  summary { cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
  summary .c { font-variant-numeric: tabular-nums; font-weight: 600; }
  ul.hits { margin: 8px 0 4px; padding-left: 18px; color: var(--muted); }
  .empty { color: var(--muted); padding: 4px 0; }
  .pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); margin: 0 6px 6px 0; }
  .pill.on { background: var(--accent); color: #fff; border-color: var(--accent); }

  .arch { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  @media (max-width: 860px) { .arch { grid-template-columns: 1fr; } }
  .arch h3 { margin: 0 0 2px; font-size: 14px; }
  .arch .cap { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .tree { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); overflow-x: auto; }
  .tree details, .tree .leaf { margin: 0; padding: 0; border: 0; }
  .tree summary { cursor: pointer; list-style: none; display: flex; justify-content: flex-start; align-items: center; flex-wrap: wrap; gap: 2px 0; padding: 1px 4px; margin-left: -4px; border-radius: 5px; }
  .tree summary::-webkit-details-marker { display: none; }
  .tree summary::before { content: '\25B8'; color: var(--muted); display: inline-block; width: 1.1em; flex: none; }
  .tree details[open] > summary::before { content: '\25BE'; }
  .tree summary:hover { background: var(--bg); }
  .tree summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tree .leaf { padding: 1px 0 1px 1.1em; display: flex; align-items: center; flex-wrap: wrap; }
  .tree .kids { margin-left: 0.5em; padding-left: 0.7em; border-left: 1px solid var(--line); }
  .tree .legacy { color: var(--warn); font-weight: 600; }
  .tree .feat { color: var(--ok); font-weight: 600; }
  .tree .shared { font-weight: 600; }
  .tree .newc { color: var(--accent); font-weight: 600; }
  .tree .file { color: var(--muted); }
  .tools { display: flex; gap: 6px; margin: 0 0 8px; }
  .tools button { font: inherit; font-size: 12px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
  .tools button:hover { border-color: var(--accent); }
  .tools button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tag { font: 11px/1 system-ui, sans-serif; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin-left: 6px; white-space: nowrap; }
  .tag.gx { color: var(--bad); border-color: var(--bad); }
  .tag.bl { color: var(--ok); border-color: var(--ok); }
  .tag.nw { color: var(--accent); border-color: var(--accent); }
  .tag.mg { color: var(--warn); border-color: var(--warn); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  .legend i { font-style: normal; font-weight: 600; }
  ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  ol.steps li { display: flex; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  ol.steps .num { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 600; font-size: 13px; display: grid; place-items: center; }
  ol.steps .st-title { font-weight: 600; }
  ol.steps .st-why { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  code.cmd { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin-left: 6px; font-weight: 400; }
</style>
</head>
<body>
<main id="app"></main>

<script id="data" type="application/json">
__AUDIT_DATA__
</script>
<script>
(function () {
  var d = JSON.parse(document.getElementById('data').textContent);
  var app = document.getElementById('app');
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  var status = {
    compliant:       { cls: 'ok',   text: 'Compliant' },
    compliant_with_warnings: { cls: 'ok', text: 'Compliant, with style warnings' },
    needs_migration: { cls: 'warn', text: 'Needs migration to BLoC' },
    non_compliant:   { cls: 'bad',  text: 'Not compliant' }
  }[d.status] || { cls: 'bad', text: d.status };

  var h = '';
  h += '<header><div><h1>Clean Architecture audit</h1><div class="sub">' + esc(d.project) + ' &middot; ' + esc(d.generated_at) + '</div></div>';
  h += '<span class="badge ' + status.cls + '">' + esc(status.text) + '</span></header>';

  h += '<div class="cards">';
  h += card(d.totals.dart_files, 'Dart files in lib/');
  h += card(d.totals.features, 'Features', d.structure_ok ? '' : 'bad');
  h += card(d.getx.total, 'GetX usages', d.getx.total ? 'bad' : 'ok');
  h += card(d.violations.errors, 'Rule violations', d.violations.errors ? 'bad' : 'ok');
  h += card(d.violations.warnings, 'Style warnings', d.violations.warnings ? 'warn' : 'ok');
  h += card(d.state_management.bloc_files, 'Cubit / Bloc files', d.state_management.bloc_files ? 'ok' : 'bad');
  h += card(d.totals.test_files, 'Test files');
  h += '</div>';

  if (!d.structure_ok) {
    h += '<h2>Structure</h2><div class="panel">No <code>lib/features/</code> directory. The project is not organised feature-first yet.</div>';
  }

  // Progress since the previous audit
  if (d.delta) {
    var labels = { dart_files: 'Dart files', test_files: 'Test files', getx_usages: 'GetX usages', files_importing_get: 'Files importing get', violation_errors: 'Rule violations', violation_warnings: 'Style warnings', bloc_files: 'Cubit / Bloc files', stateful_widgets: 'StatefulWidgets' };
    var good = { getx_usages: -1, files_importing_get: -1, violation_errors: -1, violation_warnings: -1, bloc_files: 1, test_files: 1 };
    h += '<h2>Since the previous audit</h2><div class="panel"><div class="sub" style="margin-bottom:8px">Previous: ' + esc(d.delta.previous_generated_at) + (d.delta.status.from !== d.delta.status.to ? ' &middot; status ' + esc(d.delta.status.from) + ' &rarr; ' + esc(d.delta.status.to) : '') + '</div><table><tr><th>Metric</th><th class="r">Before</th><th class="r">Now</th><th class="r">Change</th></tr>';
    d.delta.metrics.forEach(function (m) {
      var ch = m.change === null ? '<span class="sub">n/a</span>' : (m.change === 0 ? '&ndash;' : '<span style="color:var(--' + (good[m.name] && (m.change * good[m.name] > 0) ? 'ok' : (good[m.name] ? 'bad' : 'muted')) + ')">' + (m.change > 0 ? '+' : '') + m.change + '</span>');
      h += '<tr><td>' + esc(labels[m.name] || m.name) + '</td><td class="r">' + (m.from === null ? 'n/a' : m.from) + '</td><td class="r">' + m.to + '</td><td class="r">' + ch + '</td></tr>';
    });
    h += '</table></div>';
  }

  // Architecture illustration: today vs target (structure the plugin's skills prescribe)
  (function () {
    var SHARED = { bootstrap: 1, router: 1, core: 1, design_system: 1, l10n: 1 };
    function node(name, cls, tags, kids) { return { name: name, cls: cls, tags: tags || '', kids: kids || [] }; }
    function tag(txt, c) { return '<span class="tag ' + (c || '') + '">' + esc(txt) + '</span>'; }
    function count(n) { return 1 + n.kids.reduce(function (a, k) { return a + count(k); }, 0); }
    function row(n) { return '<span class="' + n.cls + '">' + esc(n.name) + '</span>' + n.tags; }
    // Folders with children are <details>: native keyboard and click behaviour. Small trees open fully; large ones open two levels.
    function html(n, depth, openAll) {
      if (!n.kids.length) return '<div class="leaf">' + row(n) + '</div>';
      // root always open; the next level opens unless it is crowded (more than 15 children, such as 30 features)
      var open = (openAll || depth === 0 || (depth === 1 && n.kids.length <= 15)) ? ' open' : '';
      return '<details' + open + '><summary>' + row(n) + '</summary><div class="kids">' + n.kids.map(function (k) { return html(k, depth + 1, openAll); }).join('') + '</div></details>';
    }
    function render(n) { return html(n, 0, count(n) <= 45); }

    // ---- today: built from the real directories ----
    var dirs = d.structure.dirs, byPath = {};
    dirs.forEach(function (x) { byPath[x.path] = x; });
    function kidsOf(path, depth, maxDepth) {
      var pre = path + '/', seen = {}, names = [];
      dirs.forEach(function (x) { if (x.path.indexOf(pre) === 0) { var rest = x.path.slice(pre.length); if (rest.indexOf('/') < 0 && !seen[rest]) { seen[rest] = 1; names.push(rest); } } });
      names.sort();
      return names.map(function (nm) {
        var full = pre + nm, x = byPath[full], top = full.split('/')[1];
        var cls = top === 'features' ? 'feat' : (SHARED[top] ? 'shared' : 'legacy');
        var t = tag(x.files + (x.files === 1 ? ' file' : ' files'));
        if (x.getx) t += tag('GetX ' + x.getx, 'gx');
        if (x.blocs) t += tag(x.blocs + (x.blocs === 1 ? ' cubit/bloc' : ' cubits/blocs'), 'bl');
        return node(nm + '/', cls, t, kidsOf(full, depth + 1, maxDepth));
      });
    }
    var cur = node('lib/', 'shared', '', []);
    d.structure.root_files.forEach(function (f) { cur.kids.push(node(f, 'file', '', [])); });
    cur.kids = kidsOf('lib', 0, 5).concat(cur.kids);
    // legacy first (that is where the work is), then features, shared folders, files
    var order = { legacy: 0, feat: 1, shared: 2, file: 3 };
    cur.kids.sort(function (a, b) { return (order[a.cls] - order[b.cls]) || (a.name < b.name ? -1 : 1); });

    // ---- target: the skills' structure, filled with this project's names ----
    var topExists = {};
    dirs.forEach(function (x) { var p = x.path.split('/'); if (p.length === 2) topExists[p[1]] = true; });
    function sharedNode(name, kids) { return node(name + '/', topExists[name] ? 'shared' : 'newc', topExists[name] ? tag('exists') : tag('create', 'nw'), kids || []); }
    var diFile = (d.packages.get_it && !d.packages.provider) ? 'injection.dart' : 'global_providers.dart';
    var wiring = (d.packages.get_it && !d.packages.provider) ? '_di.dart' : '_providers.dart';
    var routerKids = [node('app_router.dart', 'file')];
    if (d.packages.go_router) routerKids.push(node('route_tree.dart', 'file'), node('routes.dart', 'file'));
    else if (d.packages.auto_route) routerKids.push(node('app_router.gr.dart (generated)', 'file'));
    else routerKids.push(node('routes.dart (go_router or auto_route: /route asks)', 'file'));
    var realCore = dirs.filter(function (x) { return x.path.indexOf('lib/core/') === 0 && x.path.split('/').length === 3; }).map(function (x) { return x.path.split('/')[2]; }).sort();
    var coreKids = (realCore.length ? realCore : ['error', 'http', 'storage', 'logging']).map(function (n) { return node(n + '/', 'shared'); });
    var tgt = node('lib/', 'shared', '', [
      node('main.dart', 'file'), node('app.dart', 'file'),
      sharedNode('bootstrap', [node('app_config.dart', 'file'), node(diFile, 'file')]),
      sharedNode('router', routerKids),
      sharedNode('core', coreKids),
      sharedNode('design_system'),
      sharedNode('l10n')
    ]);
    var existing = d.features.map(function (f) { return f.name; });
    var fresh = d.suggested_features.filter(function (f) { return !f.exists; });
    function featureTemplate(nm) {
      return [
        node(nm + '_ids.dart', 'file'),
        node('domain/', 'shared', '', [node('entities/', 'shared'), node('repositories/', 'shared'), node('use_cases/', 'shared')]),
        node('data/', 'shared', '', [node('dtos/', 'shared'), node('mappers/', 'shared'), node('sources/', 'shared'), node(nm + '_repository_impl.dart', 'file')]),
        node('presentation/', 'shared', '', [node('cubit/', 'shared'), node('ui/', 'shared')]),
        node(nm + '_routes.dart', 'file'), node(nm + wiring, 'file')
      ];
    }
    var featKids = [], example = fresh.length ? fresh[0].name : (existing[0] || 'feature');
    existing.forEach(function (nm) { featKids.push(node(nm + '/', 'feat', tag('exists') + (nm === example ? '' : ''), nm === example ? featureTemplate(nm) : [])); });
    fresh.forEach(function (f) {
      featKids.push(node(f.name + '/', 'newc', tag('migrate · ' + f.files + ' legacy files', 'mg') + tag('/feature ' + f.name + ' --migrate', 'nw'), f.name === example ? featureTemplate(f.name) : []));
    });
    if (!featKids.length) featKids.push(node('<feature>/', 'newc', tag('new', 'nw'), featureTemplate('<feature>')));
    tgt.kids.push(node('features/', 'feat', '', featKids));
    var legacyTop = d.legacy_top_dirs.map(function (x) { return x.dir + '/ (' + x.files + ')'; });

    h += '<h2>Architecture: today and target</h2><div class="legend"><span><i class="legacy" style="color:var(--warn)">amber</i> legacy folder</span><span><i style="color:var(--ok)">green</i> feature</span><span><i style="color:var(--accent)">blue</i> to create or migrate</span><span><i>bold</i> shared folder</span></div>';
    h += '<div class="arch"><div class="panel"><h3>Today</h3><div class="cap">Your real folders under <code>lib/</code>, with Dart file counts, GetX usages and Cubit/Bloc files. Click a folder to open or close it.</div><div class="tools"><button type="button" data-act="expand" data-target="tree-today">Expand all</button><button type="button" data-act="collapse" data-target="tree-today">Collapse all</button></div><div class="tree" id="tree-today">' + render(cur) + '</div>' + (d.structure.truncated ? '<div class="cap" style="margin-top:8px">Large project: showing the first 800 of ' + d.structure.total_dirs + ' folders.</div>' : '') + '</div>';
    h += '<div class="panel"><h3>Target</h3><div class="cap">The structure the plugin\'s skills prescribe, with this project\'s names. One feature is expanded; the others use the same layout. Pick the smallest feature shape that fits: thin, with repository, or full domain.</div><div class="tools"><button type="button" data-act="expand" data-target="tree-target">Expand all</button><button type="button" data-act="collapse" data-target="tree-target">Collapse all</button></div><div class="tree" id="tree-target">' + render(tgt) + '</div>';
    if (legacyTop.length) h += '<div class="cap" style="margin-top:10px">Removed once empty: <span class="legacy" style="color:var(--warn)">' + esc(legacyTop.join(', ')) + '</span></div>';
    h += '</div></div>';
  })();

  // Suggested next steps
  if (d.next_steps && d.next_steps.length) {
    h += '<h2>Suggested next steps</h2><ol class="steps">';
    d.next_steps.forEach(function (st) {
      var chip = (st.command && st.command !== '(review)') ? ' <code class="cmd">' + esc(st.command) + '</code>' : '';
      h += '<li><span class="num">' + st.order + '</span><div><div class="st-title">' + esc(st.title) + chip + '</div><div class="st-why">' + esc(st.why) + '</div></div></li>';
    });
    h += '</ol><div class="sub" style="margin-top:8px">Order follows the plugin\'s migration workflow. Run a step, then re-run <code>/audit</code> to see the progress.</div>';
  }

  // Layer distribution
  var names = { domain: 'domain', data: 'data', presentation: 'presentation', feature_root: 'feature root', core: 'core', design_system: 'design system', l10n: 'l10n', bootstrap: 'bootstrap', router: 'router', root: 'lib root', other: 'outside features/' };
  var max = Math.max.apply(null, Object.keys(d.layers).map(function (k) { return d.layers[k]; }).concat([1]));
  h += '<h2>File distribution</h2><div class="panel">';
  Object.keys(names).forEach(function (k) {
    var v = d.layers[k] || 0;
    if (!v && k !== 'domain' && k !== 'data' && k !== 'presentation') return;
    h += '<div class="bar-row"><span>' + names[k] + '</span><div class="bar"><i class="' + (k === 'other' ? 'bad' : '') + '" style="width:' + (v / max * 100) + '%"></i></div><span class="num">' + v + '</span></div>';
  });
  if (d.legacy_top_dirs.length) {
    h += '<div class="sub" style="margin-top:10px">Legacy folders outside <code>features/</code>: ' + d.legacy_top_dirs.map(function (x) { return '<code>' + esc(x.dir) + '/</code> (' + x.files + ')'; }).join(', ') + '</div>';
  }
  h += '</div>';

  // GetX leakage
  h += '<h2>GetX leakage</h2><div class="panel">';
  if (!d.getx.total) h += '<div class="empty">No GetX usage found.</div>';
  d.getx.categories.forEach(function (c) {
    if (!c.count) return;
    h += '<details><summary><span>' + esc(c.label) + '</span><span class="c">' + c.count + '</span></summary><ul class="hits">';
    c.hits.forEach(function (x) { h += '<li><code>' + esc(x.file) + ':' + x.line + '</code></li>'; });
    if (c.count > c.hits.length) h += '<li>&hellip; and ' + (c.count - c.hits.length) + ' more</li>';
    h += '</ul></details>';
  });
  h += '</div>';

  // Violations
  h += '<h2>Violations and warnings</h2><div class="panel">';
  if (!d.violations.count) h += '<div class="empty">No violations or warnings.</div>';
  else {
    h += '<table><tr><th>Severity</th><th>Rule</th><th>Feature</th><th>Location</th></tr>';
    d.violations.items.forEach(function (v) { h += '<tr><td><span class="badge ' + (v.severity === 'error' ? 'bad' : 'warn') + '" style="font-size:12px;padding:1px 8px">' + esc(v.severity) + '</span></td><td>' + esc(v.rule) + '</td><td>' + esc(v.feature) + '</td><td><code>' + esc(v.file) + ':' + v.line + '</code></td></tr>'; });
    h += '</table>';
  }
  h += '</div>';

  // Features
  if (d.features.length) {
    h += '<h2>Features</h2><div class="panel"><table><tr><th>Feature</th><th class="r">Files</th><th class="r">Domain</th><th class="r">Data</th><th class="r">Presentation</th><th class="r">Blocs</th><th class="r">GetX</th><th class="r">Tests</th></tr>';
    d.features.forEach(function (f) {
      h += '<tr><td>' + esc(f.name) + '</td><td class="r">' + f.files + '</td><td class="r">' + f.domain + '</td><td class="r">' + f.data + '</td><td class="r">' + f.presentation + '</td><td class="r">' + f.blocs + '</td><td class="r">' + (f.getx_hits || '&ndash;') + '</td><td class="r">' + (f.has_tests ? 'yes' : '<span style="color:var(--warn)">none</span>') + '</td></tr>';
    });
    h += '</table></div>';
  }

  // State management & packages
  var s = d.state_management;
  h += '<h2>State management &amp; packages</h2><div class="panel">';
  h += '<p style="margin-top:0">StatefulWidgets: <b>' + s.stateful_widgets + '</b> &middot; setState calls: <b>' + s.set_state_calls + '</b> &middot; ChangeNotifiers: <b>' + s.change_notifiers + '</b></p>';
  Object.keys(d.packages).forEach(function (k) { h += '<span class="pill' + (d.packages[k] ? ' on' : '') + '">' + k + '</span>'; });
  h += '</div>';

  if (d.coverage) {
    h += '<h2>What this audit covers</h2><div class="panel"><p style="margin-top:0"><b>Checked</b></p>' + d.coverage.checked.map(function (x) { return '<span class="pill on">' + esc(x) + '</span>'; }).join('');
    h += '<p><b>Not checked</b> (review manually or ask Claude)</p>' + d.coverage.not_checked.map(function (x) { return '<span class="pill">' + esc(x) + '</span>'; }).join('') + '</div>';
  }

  if (d.migration_prompt) {
    h += '<h2>Next step</h2><div class="panel">Legacy state management detected with no BLoC architecture found. Return to Claude Code to choose whether to migrate this project to BLoC.</div>';
  }

  app.innerHTML = h;
  if (app.querySelectorAll) {
    app.querySelectorAll('.tools button').forEach(function (b) {
      b.addEventListener('click', function () {
        var box = document.getElementById(b.getAttribute('data-target'));
        if (!box) return;
        var all = box.querySelectorAll('details');
        if (b.getAttribute('data-act') === 'expand') { all.forEach(function (x) { x.open = true; }); }
        else { all.forEach(function (x) { x.open = false; }); var first = box.querySelector('details'); if (first) first.open = true; }
      });
    });
  }
  function card(n, l, cls) { return '<div class="card ' + (cls || '') + '"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>'; }
})();
</script>
</body>
</html>
